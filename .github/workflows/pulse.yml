name: pulse

on:
  schedule:
    - cron: "17 3 * * *"   # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/pulse.py, scripts/palette.py, .github/workflows/pulse.yml]

permissions:
  contents: write

concurrency:
  group: pulse
  cancel-in-progress: true

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Draw the activity line
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/pulse.py "${{ github.repository_owner }}" dist

      # The SVGs live on their own branch so main's history stays readable.
      - name: Publish to the output branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init -q -b output
          git add .
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Update activity line"
          git push -fq "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}" output
